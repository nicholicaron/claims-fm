# Phase 2 cell 46m5s: Task B single-sequence pretrained-only LE grid
# (registered touches; run with --pretrained-only). Hyperparameters held at
# v1.0 finetune_b.yaml values per the registered policy.

seed: 20260721

data:
  pack_dir: data/processed/task_b_pack
  max_len: 512

model:                        # must match the 46m5s pretrained encoder
  d_model: 512
  n_layers: 10
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_positions: 512
  n_claim_types: 4
  n_ages: 112
  n_months: 37

modes:
  full:    { head_lr: 1.0e-3, encoder_lr: 3.0e-5 }

labels: [label]

label_efficiency:
  fracs: [0.10, 0.25]
  seeds: 3

train:
  tokens_per_batch: 16384
  max_epochs: 8
  patience: 2
  head_dropout: 0.1
  grad_clip: 1.0
  log_every_steps: 50

checkpoint: data/checkpoints/pretrain_46m_5s/best.pt
out_dir: data/finetune/task_b_46m5s
