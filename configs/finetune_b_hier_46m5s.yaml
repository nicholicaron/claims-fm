# Phase 2 hierarchical capstone at the best scaled cell — selected per the
# registered rule (reports/scaling_prereg.md): highest single-seq Task B val
# AUPRC of the full-mode 100%-label run (46m5s 0.6777 vs 46m18s 0.6597,
# 17m18s 0.6500). Architecture/pooling identical to finetune_b_hier.yaml;
# model block matches the C3 (46M @ 5-sample) encoder.

seed: 20260721

data:
  pack_dir: data/processed/task_b_pack_chunked
  chunk_len: 512

model:                        # must match the pretrain_46m_5s encoder
  d_model: 512
  n_layers: 10
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_positions: 512
  n_claim_types: 4
  n_ages: 112
  n_months: 37

modes:
  full:    { head_lr: 1.0e-3, encoder_lr: 3.0e-5 }
  scratch: { head_lr: 1.0e-3, encoder_lr: 3.0e-4 }
  probe:   { head_lr: 1.0e-3, encoder_lr: 0.0 }

pooling:
  kind: gated
  d_att: 128
  k_train: 8

labels: [label]

label_efficiency:
  fracs: [0.10, 0.25]
  seeds: 3

train:
  tokens_per_batch: 16384
  max_epochs: 8
  patience: 2
  head_dropout: 0.1
  grad_clip: 1.0
  log_every_steps: 50

checkpoint: data/checkpoints/pretrain_46m_5s/best.pt
out_dir: data/finetune/task_b_hier_46m5s
