# Local CPU/MPS smoke config: tiny model, 5k-member sub-pack, validates the
# full loop (train -> checkpoint -> kill -> resume) before any GPU spend.

seed: 20260721

data:
  pack_dir: data/processed/pretrain_pack_smoke
  val_frac: 0.02
  max_len: 512

model:
  d_model: 128
  n_layers: 2
  n_heads: 4
  d_ff: 512
  dropout: 0.1
  max_positions: 512
  n_claim_types: 4
  n_ages: 112
  n_months: 37

masking:
  rate: 0.15
  prob_mask: 0.8
  prob_random: 0.1

optim:
  peak_lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  warmup_frac: 0.03
  final_lr_frac: 0.1
  grad_clip: 1.0

train:
  tokens_per_batch: 4096      # 28k-class logits dominate memory; fits 8GB MPS
  max_epochs: 2
  early_stop_patience: 3
  checkpoint_every_steps: 50
  keep_checkpoints: 3
  log_every_steps: 10
  out_dir: data/checkpoints/pretrain_smoke
