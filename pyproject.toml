[project]
name = "claimsfm"
version = "0.1.0"
description = "Small claims foundation model: one pretrained claims encoder, two payer tasks (risk stratification, provider fraud)"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.12",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "kaggle>=1.6",
]
train = [
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
